<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MEGA GARDEN 4</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="title">🌿 MEGA GARDEN 4</div>
        <div class="coins" id="coinDisplay">
            <span class="coin-icon">🪙</span>
            <span class="coin-value">0.0</span>
        </div>
        <button id="closeBtn" class="close-btn">✕</button>
    </div>

    <!-- ===== ГРЯДКА (4x4) ===== -->
    <div class="garden-grid" id="gardenGrid"></div>

    <!-- ===== 3D КНОПКА-КЛИКЕР ===== -->
    <div class="ground-3d" id="ground">
        <div class="ground-inner">
            <div class="ground-emoji">🌍</div>
            <div class="ground-text">👇 ТЫКАЙ СЮДА!</div>
        </div>
        <div class="ground-shine"></div>
        <div class="float-text" id="floatText"></div>
    </div>

    <!-- ===== МАГАЗИН ===== -->
    <div class="shop" id="shop"></div>

    <script src="game.js"></script>
</body>
</html>
