<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OUR GARDEN</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="title">🌿 OUR GARDEN</div>
        <div class="coins" id="coinDisplay">
            <span class="coin-icon">🪙</span>
            <span class="coin-value">0.0</span>
        </div>
    </div>

    <!-- ===== ПОЛЕ ДЛЯ РАСТЕНИЙ ===== -->
    <div class="garden-area" id="gardenArea">
        <div class="garden-area-empty">🌱 Посади своё первое растение!</div>
    </div>

    <!-- ===== КРУГЛАЯ КНОПКА-КЛИКЕР ===== -->
    <div class="clicker-container">
        <div class="clicker-btn" id="ground">
            <div class="clicker-inner">
                <span class="clicker-emoji">🌍</span>
                <span class="clicker-text">ТЫКАЙ!</span>
            </div>
            <div class="clicker-shine"></div>
            <div class="float-text" id="floatText"></div>
        </div>
    </div>

    <!-- ===== КНОПКИ: МИНИ-ИГРА + МАГАЗИН ===== -->
    <div class="action-buttons">
        <button class="action-btn" id="miniGameBtn">🎮 Три в ряд</button>
        <button class="action-btn" id="shopBtn">🏪 Магазин</button>
    </div>

    <!-- ===== МИНИ-ИГРА (СКРЫТА ПО УМОЛЧАНИЮ) ===== -->
    <div class="mini-game" id="miniGame" style="display:none;">
        <div class="mini-game-header">
            <span>🎮 Три в ряд</span>
            <button class="close-game" id="closeGame">✕</button>
        </div>
        <div class="mini-game-info">
            <span>Уровень: <span id="levelDisplay">1</span></span>
            <span>Награда: 10 🪙</span>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <div class="game-status" id="gameStatus">Собери 3 одинаковых!</div>
    </div>

    <!-- ===== МАГАЗИН (СКРЫТ ПО УМОЛЧАНИЮ) ===== -->
    <div class="shop-overlay" id="shopOverlay" style="display:none;">
        <div class="shop-panel">
            <div class="shop-header">
                <span>🏪 Магазин семян</span>
                <button class="close-shop" id="closeShop">✕</button>
            </div>
            <div class="shop" id="shop"></div>
        </div>
    </div>

    <!-- ===== КНОПКА ЯЗЫКА ===== -->
    <button class="lang-btn" id="langBtn">🇬🇧 EN</button>

    <script src="game.js"></script>
</body>
</html>
