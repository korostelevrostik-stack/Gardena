<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OUR GARDEN</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== РАСТЕНИЯ (САМЫЙ ВЕРХ) ===== -->
    <div class="garden-area" id="gardenArea">
        <div class="garden-area-empty">🌱 Посади своё первое растение!</div>
    </div>

    <!-- ===== ШАПКА: НАЗВАНИЕ + МОНЕТЫ ===== -->
    <div class="header">
        <div class="title">🌿 OUR GARDEN</div>
        <div class="coins" id="coinDisplay">
            <span class="coin-icon">🪙</span>
            <span class="coin-value">0.0</span>
        </div>
    </div>

    <!-- ===== КНОПКИ: МАГАЗИН + ТРИ В РЯД ===== -->
    <div class="action-buttons">
        <button class="action-btn" id="shopBtn">🏪 Магазин</button>
        <button class="action-btn" id="miniGameBtn">🎮 Три в ряд</button>
    </div>

    <!-- ===== ОГРОМНАЯ КРУГЛАЯ КНОПКА-КЛИКЕР (ВНИЗУ) ===== -->
    <div class="clicker-wrapper">
        <div class="clicker-btn" id="ground">
            <div class="clicker-inner">
                <span class="clicker-emoji">🌍</span>
                <span class="clicker-text">ТЫКАЙ!</span>
            </div>
            <div class="clicker-shine"></div>
            <div class="float-text" id="floatText"></div>
        </div>
    </div>

    <!-- ===== МИНИ-ИГРА (ПОВЕРХ) ===== -->
    <div class="overlay" id="miniGameOverlay" style="display:none;">
        <div class="overlay-content">
            <div class="overlay-header">
                <span>🎮 Три в ряд</span>
                <button class="overlay-close" id="closeGame">✕</button>
            </div>
            <div class="mini-game-info">
                <span>Уровень: <span id="levelDisplay">1</span></span>
                <span>Награда: 10 🪙</span>
            </div>
            <div class="game-board" id="gameBoard"></div>
            <div class="game-status" id="gameStatus">Собери 3 одинаковых!</div>
        </div>
    </div>

    <!-- ===== МАГАЗИН (ПОВЕРХ) ===== -->
    <div class="overlay" id="shopOverlay" style="display:none;">
        <div class="overlay-content shop-content">
            <div class="overlay-header">
                <span>🏪 Магазин семян</span>
                <button class="overlay-close" id="closeShop">✕</button>
            </div>
            <div class="shop" id="shop"></div>
        </div>
    </div>

    <!-- ===== ЕЖЕДНЕВНЫЙ БОНУС (МАЛЕНЬКАЯ КНОПКА) ===== -->
    <button class="daily-btn" id="dailyBonusBtn">🎁</button>

    <!-- ===== ЯЗЫК ===== -->
    <button class="lang-btn" id="langBtn">🇬🇧 EN</button>

    <script src="match3.js"></script>
    <script src="game.js"></script>
</body>
</html>
